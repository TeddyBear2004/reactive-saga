name: Publish

on:
  push:
    branches: [master]
    tags: ['v*']

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'
          check-latest: true

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "args=-PprojectVersion=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        run: ./gradlew build --no-daemon ${{ steps.version.outputs.args }}

      - name: Publish
        run: ./gradlew publish --no-daemon ${{ steps.version.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
